name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
      next:
        description: 'Next development version (e.g. 1.0.2-SNAPSHOT); computed if omitted'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 'Set up Java'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      # The release version is committed locally only; nothing is pushed to main until the
      # release has fully succeeded. JReleaser tags the local commit and pushes the tag,
      # which carries the commit objects, so a failed release leaves main untouched.
      - name: 'Set release version'
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Version is already ${{ github.event.inputs.version }}; skipping commit"
          else
            git commit -am "[RELEASE] Bump version to ${{ github.event.inputs.version }}"
          fi

      - name: 'Build and stage artifacts'
        run: ./mvnw -B -Pdist,release deploy

      # Tag the local release commit and push only the tag; the tag push transports the
      # commit objects, so JReleaser releases from the exact bump commit while main remains
      # unpushed. If the release fails, clean up with: git push --delete origin v<version>
      - name: 'Tag release'
        run: |
          if ! git rev-parse -q --verify "refs/tags/v${{ github.event.inputs.version }}" > /dev/null; then
            git tag "v${{ github.event.inputs.version }}"
          fi
          git push origin "refs/tags/v${{ github.event.inputs.version }}"

      - name: 'Release to GitHub and Maven Central'
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: ./mvnw -B -Prelease jreleaser:full-release

      - name: 'Push release commit'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: 'Set next development version'
        run: |
          if [ -z "${{ github.event.inputs.next }}" ]; then
            ./mvnw -B versions:set -DnextSnapshot=true -DgenerateBackupPoms=false
          else
            ./mvnw -B versions:set -DnewVersion=${{ github.event.inputs.next }} -DgenerateBackupPoms=false
          fi
          NEXT_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          git commit -am "[RELEASE] Prepare for ${NEXT_VERSION} development iteration"
          git push

      - name: 'Upload JReleaser output'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-release
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties