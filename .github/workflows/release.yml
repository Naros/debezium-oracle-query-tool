name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
      next:
        description: 'Next development version (e.g. 1.0.2-SNAPSHOT); computed if omitted'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 'Check out repository'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 'Set up Java'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'

      - name: 'Set release version'
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "[RELEASE] Bump version to ${{ github.event.inputs.version }}"
          git push

      - name: 'Build and stage artifacts'
        run: ./mvnw -B -Pdist,release deploy

      - name: 'Release to GitHub and Maven Central'
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: ./mvnw -B -Prelease jreleaser:full-release

      - name: 'Set next development version'
        run: |
          if [ -z "${{ github.event.inputs.next }}" ]; then
            ./mvnw -B versions:set -DnextSnapshot=true -DgenerateBackupPoms=false
          else
            ./mvnw -B versions:set -DnewVersion=${{ github.event.inputs.next }} -DgenerateBackupPoms=false
          fi
          NEXT_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          git commit -am "[RELEASE] Prepare for ${NEXT_VERSION} development iteration"
          git push

      - name: 'Upload JReleaser output'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-release
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties